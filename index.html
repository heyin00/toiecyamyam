<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>토익 얌얌</title>
<style>
  :root{
    --paper:#FFF9FB;
    --paper-line:#F1D9E4;
    --ink:#3A2C35;
    --ink-soft:#8A7480;
    --accent:#D6588F;
    --accent-soft:#FBE6EF;
    --accent2:#9C6B98;
    --accent2-soft:#F3E6F0;
    --correct:#2E9E5B;
    --correct-soft:#E3F5EA;
    --red:#D6555F;
    --red-soft:#FCE8EA;
    --card-shadow: 0 10px 26px rgba(214,88,143,0.10), 0 2px 6px rgba(58,44,53,0.06);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(900px circle at 50% -8%, #FCE3EF 0%, rgba(252,227,239,0) 60%),
      linear-gradient(180deg, #FFF3F8 0%, var(--paper) 420px);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", -apple-system, BlinkMacSystemFont, sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
    padding:28px 16px 60px;
  }
  .app{
    width:100%;
    max-width:640px;
  }
  .masthead{
    text-align:center;
    margin-bottom:18px;
  }
  .masthead h1{
    font-family: Georgia, "Nanum Myeongjo", serif;
    font-size:30px;
    letter-spacing:0.5px;
    margin:0 0 6px;
    color:var(--ink);
  }
  .masthead .deck-name-line{
    margin:0 0 4px;
    font-size:15px;
    font-weight:700;
    color:var(--accent);
  }
  .masthead p{
    margin:0;
    font-size:13px;
    color:var(--ink-soft);
    letter-spacing:0.3px;
  }
  .tabs{
    display:flex;
    gap:6px;
    margin:22px 0 20px;
    border-bottom:2px solid var(--accent);
  }
  .tab{
    position:relative;
    flex:1;
    padding:11px 6px;
    text-align:center;
    background:#FBE6EF;
    border:2px solid var(--accent);
    border-bottom:none;
    border-radius:10px 10px 0 0;
    font-weight:700;
    font-size:13px;
    cursor:pointer;
    color:var(--ink-soft);
    transform:translateY(3px);
    transition:transform .15s ease, background .15s ease, color .15s ease;
  }
  .tab.active{
    background:var(--paper);
    color:var(--ink);
    transform:translateY(0);
  }
  .badge{
    display:inline-block;
    min-width:18px;
    padding:1px 6px;
    margin-left:6px;
    border-radius:999px;
    background:var(--red);
    color:#fff;
    font-size:11px;
    font-weight:700;
    vertical-align:middle;
  }
  .badge.zero{ background:#E3B7CC; }

  /* ---- Deck selector ---- */
  .deck-label{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:0.4px;
    margin:20px 0 8px;
    font-weight:700;
  }
  .deck-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
  }
  .deck-card{
    flex:1;
    min-width:140px;
    text-align:left;
    background:#FBE6EF;
    border:2px solid transparent;
    border-radius:12px;
    padding:12px 14px;
    cursor:pointer;
    transition: border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .deck-card:hover{ transform:translateY(-1px); }
  .deck-card.active{
    background:#fff;
    border-color:var(--accent);
    box-shadow:0 4px 12px rgba(214,88,143,0.18);
  }
  .deck-card .deck-name{
    font-weight:700;
    font-size:14px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:6px;
  }
  .deck-card .deck-meta{
    font-size:11.5px;
    color:var(--ink-soft);
    margin-top:4px;
  }

  /* ---- Quiz card ---- */
  .card{
    position:relative;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:14px;
    box-shadow:var(--card-shadow);
    padding:30px 26px 26px;
    min-height:300px;
  }
  .card::before{
    content:"";
    position:absolute;
    top:14px; left:24px; right:24px;
    height:0;
    border-top:1.5px dashed #F1D9E4;
  }
  .holes{
    position:absolute;
    top:-9px; left:50%;
    transform:translateX(-50%);
    display:flex; gap:26px;
  }
  .holes span{
    width:16px; height:16px; border-radius:50%;
    background:var(--paper);
    border:2px solid var(--paper-line);
    box-shadow: inset 0 2px 3px rgba(0,0,0,0.08);
  }
  .progress-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:12.5px;
    color:var(--ink-soft);
    margin:16px 0 22px;
  }
  .progress-bar{
    height:5px;
    background:var(--paper-line);
    border-radius:99px;
    overflow:hidden;
    margin-top:6px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    transition:width .25s ease;
  }
  .q-type{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    letter-spacing:0.4px;
    color:var(--accent);
    background:var(--accent-soft);
    padding:3px 9px;
    border-radius:999px;
    margin-bottom:14px;
  }
  .q-type.rev{ color:var(--accent2); background:var(--accent2-soft); }
  .q-word{
    font-family: Georgia, "Nanum Myeongjo", serif;
    font-size:26px;
    font-weight:700;
    line-height:1.35;
    margin:0 0 26px;
    color:var(--ink);
  }
  .choices{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .choice{
    text-align:left;
    padding:13px 16px;
    border:1.5px solid var(--paper-line);
    background:#FFFAFC;
    border-radius:10px;
    font-size:14.5px;
    cursor:pointer;
    color:var(--ink);
    transition: border-color .12s ease, background .12s ease, transform .08s ease;
  }
  .choice:hover:not(:disabled){
    border-color:var(--ink-soft);
    transform:translateY(-1px);
  }
  .choice:disabled{ cursor:default; }
  .choice.correct{
    border-color:var(--correct);
    border-width:1.5px;
    background:var(--correct-soft);
    color:var(--ink);
    font-weight:700;
  }
  .choice.correct::after{
    content:" ✓";
  }
  .choice.wrong{
    border-color:var(--red);
    border-width:1.5px;
    background:var(--red-soft);
    color:var(--ink);
    font-weight:700;
  }
  .choice.wrong::after{
    content:" ✕";
  }
  .foot-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-top:22px;
    gap:10px;
    flex-wrap:wrap;
  }
  .btn{
    border:none;
    border-radius:9px;
    padding:11px 18px;
    font-size:14px;
    font-weight:700;
    cursor:pointer;
    transition: filter .12s ease, transform .08s ease;
  }
  .btn:active{ transform:scale(0.97); }
  .btn-primary{ background:linear-gradient(135deg,#E8719F,#D6588F 55%,#C0509A); color:#fff; box-shadow:0 6px 14px rgba(214,88,143,0.28); }
  .btn-primary:hover{ filter:brightness(1.06); }
  .btn-wide{ display:block; width:100%; text-align:center; padding:15px 18px; font-size:16px; border-radius:14px; }
  .foot-row .btn{ flex:1 1 130px; text-align:center; padding:13px 14px; border-radius:12px; }
  .masthead h1{ color:#E8307E; font-size:36px; font-weight:800; }
  .masthead .deck-name-line{ display:inline-block; padding:4px 14px; border-radius:999px; background:var(--accent-soft); }
  .dir-wrap{ display:flex; gap:6px; padding:4px; margin:10px 0 0; background:var(--accent-soft); border-radius:12px; }
  .dir-btn{ flex:1; border:none; background:transparent; padding:9px 6px; border-radius:9px; font-size:13px; font-weight:700; color:var(--ink-soft); cursor:pointer; font-family:inherit; }
  .dir-btn.on{ background:#fff; color:var(--accent); box-shadow:0 2px 6px rgba(214,88,143,0.18); }
  .all-btn-wrap{ margin:14px 0 6px; display:flex; justify-content:center; }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border:1.5px solid var(--paper-line); }
  .btn-ghost:hover{ border-color:var(--ink-soft); color:var(--ink); }
  .btn:disabled{ opacity:0.4; cursor:not-allowed; }

  .summary{
    text-align:center;
    padding:20px 10px 6px;
  }
  .summary .score{
    font-family: Georgia, serif;
    font-size:44px;
    font-weight:700;
    color:var(--accent);
    margin:6px 0 2px;
  }
  .summary p{ color:var(--ink-soft); font-size:14px; }

  /* ---- Wordbook ---- */
  .wb-empty{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-soft);
    border:1.5px dashed var(--paper-line);
    border-radius:14px;
    background:#fff;
  }
  .wb-empty .emoji{ font-size:34px; display:block; margin-bottom:10px; }
  .wb-list{ display:flex; flex-direction:column; gap:10px; }
  .wb-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:12px;
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:12px;
    padding:14px 16px;
    box-shadow:0 2px 6px rgba(32,41,58,0.05);
  }
  .wb-text{ flex:1; min-width:0; }
  .wb-en{ font-weight:700; font-size:15px; color:var(--ink); }
  .wb-kr{ font-size:13px; color:var(--ink-soft); margin-top:3px; line-height:1.4; }
  .wb-remove{
    flex-shrink:0;
    border:1.5px solid var(--accent);
    color:var(--accent);
    background:#fff;
    border-radius:8px;
    padding:8px 12px;
    font-size:12.5px;
    font-weight:700;
    cursor:pointer;
    white-space:nowrap;
  }
  .wb-remove:hover{ background:var(--accent-soft); }

  .loading{ text-align:center; color:var(--ink-soft); padding:60px 0; font-size:14px; }

  /* ---- Score log ---- */
  .score-list{ display:flex; flex-direction:column; gap:12px; }
  .score-card{
    background:#fff;
    border:1px solid var(--paper-line);
    border-radius:14px;
    padding:16px 18px;
    box-shadow:0 2px 6px rgba(61,34,51,0.06);
  }
  .score-card-head{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
  }
  .score-round-name{
    font-weight:700;
    font-size:15px;
    color:var(--ink);
    border:none;
    background:transparent;
    border-bottom:1.5px dashed var(--paper-line);
    padding:2px 2px 4px;
    width:120px;
  }
  .score-round-name:focus{ outline:none; border-bottom-color:var(--accent); }
  .score-del{
    border:none;
    background:transparent;
    color:var(--ink-soft);
    cursor:pointer;
    font-size:13px;
  }
  .score-del:hover{ color:var(--red); }
  .score-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-bottom:10px;
  }
  .score-field label{
    display:block;
    font-size:11.5px;
    color:var(--ink-soft);
    margin-bottom:4px;
    font-weight:700;
  }
  .score-field input[type=number]{
    width:100%;
    padding:8px 10px;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    font-size:14px;
    color:var(--ink);
  }
  .score-field input[type=number]:focus{ outline:none; border-color:var(--accent); }
  .score-scaled{
    font-size:12px;
    color:var(--accent2);
    margin-top:4px;
    font-weight:700;
  }
  .score-total{
    font-size:13px;
    color:var(--ink);
    background:var(--accent-soft);
    border-radius:8px;
    padding:8px 10px;
    margin-bottom:10px;
    font-weight:700;
  }
  .score-note{
    width:100%;
    min-height:50px;
    border:1.5px solid var(--paper-line);
    border-radius:8px;
    padding:8px 10px;
    font-size:13px;
    color:var(--ink);
    font-family:inherit;
    resize:vertical;
  }
  .score-note:focus{ outline:none; border-color:var(--accent); }
  .score-add-btn{
    display:block;
    width:100%;
    margin-top:6px;
    padding:13px;
    border:1.5px dashed var(--paper-line);
    background:#fff;
    border-radius:12px;
    color:var(--ink-soft);
    font-weight:700;
    font-size:14px;
    cursor:pointer;
  }
  .score-add-btn:hover{ border-color:var(--accent); color:var(--accent); }
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>토익 얌얌🐿️</h1>
    <p class="deck-name-line">ALL NEW 토익 실전모의고사 어휘</p>
    <p id="subtitle">총 82개 단어 · 4지선다 시험지</p>
  </div>

  <div class="deck-label">단어장 선택</div>
  <div class="deck-row" id="deck-row"></div>

  <div class="all-btn-wrap">
    <button class="btn btn-primary btn-wide" onclick="switchTab('mix')">🎲 전체에서 랜덤 20문제</button>
  </div>

  <div class="dir-wrap">
    <button class="dir-btn" id="dir-e2k" onclick="setDir('e2k')">영어 보고 뜻 고르기</button>
    <button class="dir-btn" id="dir-k2e" onclick="setDir('k2e')">뜻 보고 영어 고르기</button>
  </div>

  <div class="tabs">
    <div class="tab active" id="tab-quiz" onclick="switchTab('quiz')">시험지</div>
    <div class="tab" id="tab-mix" onclick="switchTab('mix')">쪽지시험</div>
    <div class="tab" id="tab-wb" onclick="switchTab('wb')">오답노트<span class="badge zero" id="wb-badge">0</span></div>
    <div class="tab" id="tab-score" onclick="switchTab('score')">성적 기록</div>
  </div>

  <div id="quiz-view"></div>
  <div id="mix-view" style="display:none;"></div>
  <div id="wb-view" style="display:none;"></div>
  <div id="score-view" style="display:none;"></div>
</div>

<script>
const memStore = {};
const kv = {
  async get(k){ try{ const v = localStorage.getItem(k); return v === null ? null : { value: v }; }catch(e){ return (k in memStore) ? { value: memStore[k] } : null; } },
  async set(k, v){ try{ localStorage.setItem(k, v); }catch(e){ memStore[k] = v; } },
  async delete(k){ try{ localStorage.removeItem(k); }catch(e){ delete memStore[k]; } }
};

/* ---------------- Storage ---------------- */
let wrongIdsMap = { par7: [], p15: [], p67: [], p5: [], lc: [], coll: [], gram: [] };

function storageKey(deckId){ return 'wrong_word_ids_' + deckId; }

async function loadWrongIds(){
  for(const deckId of Object.keys(DECKS)){
    try{
      const res = await kv.get(storageKey(deckId), false);
      wrongIdsMap[deckId] = (res && res.value) ? JSON.parse(res.value) : [];
    }catch(e){
      wrongIdsMap[deckId] = [];
    }
  }
}
async function saveWrongIds(deckId){
  try{
    await kv.set(storageKey(deckId), JSON.stringify(wrongIdsMap[deckId]), false);
  }catch(e){ /* ignore */ }
}
async function addWrong(id, deckId){
  deckId = deckId || currentDeck;
  const list = wrongIdsMap[deckId];
  if(!list.includes(id)){
    list.push(id);
    await saveWrongIds(deckId);
    renderBadge();
  }
}
async function removeWrong(id, deckId){
  deckId = deckId || currentDeck;
  const list = wrongIdsMap[deckId];
  const idx = list.indexOf(id);
  if(idx > -1){
    list.splice(idx,1);
    await saveWrongIds(deckId);
    renderBadge();
    if(currentTab === 'wb') renderWordbook();
  }
}
function renderBadge(){
  const count = Object.keys(wrongIdsMap).reduce((n, k) => n + wrongIdsMap[k].length, 0);
  const badge = document.getElementById('wb-badge');
  badge.textContent = count;
  badge.className = 'badge' + (count === 0 ? ' zero' : '');
  renderDeckRow();
}

/* ---------------- Quiz progress (resume where you left off) ---------------- */
let progressMap = {};
function progressKey(deckId){ return 'quiz_progress_' + deckId; }

async function loadProgress(){
  for(const deckId of Object.keys(DECKS)){
    try{
      const res = await kv.get(progressKey(deckId), false);
      progressMap[deckId] = (res && res.value) ? JSON.parse(res.value) : null;
    }catch(e){
      progressMap[deckId] = null;
    }
  }
}
async function saveProgress(deckId){
  try{
    if(progressMap[deckId]){
      await kv.set(progressKey(deckId), JSON.stringify(progressMap[deckId]), false);
    }
  }catch(e){ /* ignore */ }
}
async function clearProgress(deckId){
  progressMap[deckId] = null;
  try{
    await kv.delete(progressKey(deckId), false);
  }catch(e){ /* ignore - key may not exist */ }
}

function renderWordbook(){
  const el = document.getElementById('wb-view');
  let total = 0, html = '';
  Object.keys(DECKS).forEach(deckId => {
    const byDeck = {};
    DECKS[deckId].words.forEach(w => byDeck[w[0]] = w);

    items.forEach(w => {
      html += `

        <div class="wb-text">
          <div class="wb-en">${escapeHtml(w[1])}</div>
          <div class="wb-kr">${escapeHtml(w[2])}</div>

    });

  });

    el.innerHTML = `<div class="wb-empty"><span class="emoji">🌱</span>아직 틀린 단어가 없어요.<br>시험지를 풀어보세요!</div>`;

  }
  el.innerHTML = html;
}

function escapeHtml(s){
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ---------------- Quiz engine ---------------- */
let quiz = []; // array of {word, type, options, correctIndex}
let qIndex = 0;
let correctCount = 0;
let answeredCurrent = false;

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i+1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

let isFullQuiz = true;
let quizDir = 'e2k'; // 'k2e' = 뜻을 보고 영어 고르기, 'e2k' = 영어를 보고 뜻 고르기

function makeQuizItem(w, type, allWords){
  let correctVal, distractors;
  if(type === 'seq'){
    correctVal = w[2];
    distractors = shuffle(allWords.filter(x => x[0] !== w[0]))
      .slice(0, 3)
      .map(x => x[2]);
  } else {
    correctVal = type === 'e2k' ? w[2] : w[1];
    distractors = shuffle(allWords.filter(x => x[0] !== w[0]))
      .slice(0, 3)
      .map(x => type === 'e2k' ? x[2] : x[1]);
  }
  const options = shuffle([correctVal, ...distractors]);
  return { word: w, type, options, correctVal };
}

function makeTypesFor(order, quizType){
  if(quizType === 'pair'){
    return Array(order.length).fill('seq');
  }
  // Always show the English word/phrase and ask for its Korean meaning.
  return Array(order.length).fill(quizDir);
}

function buildQuiz(size, forceNew){
  const allWords = DECKS[currentDeck].words;
  const quizType = DECKS[currentDeck].quizType || 'trans';
  if(allWords.length < 4){
    quiz = [];
    qIndex = 0;
    correctCount = 0;
    return;
  }

  if(size){
    // Random subset (e.g. "랜덤 10문제") — always fresh, never saved/resumed.
    isFullQuiz = false;
    const words = shuffle(allWords).slice(0, Math.min(size, allWords.length));
    const order = shuffle(words);
    const types = makeTypesFor(order, quizType);
    quiz = order.map((w, i) => makeQuizItem(w, types[i], words));
    qIndex = 0;
    correctCount = 0;
    answeredCurrent = false;
    return;
  }

  // Full-deck quiz — resumable.
  isFullQuiz = true;
  const saved = !forceNew ? progressMap[currentDeck] : null;
  const savedValid = saved && Array.isArray(saved.order)
    && saved.order.length === allWords.length
    && saved.order.every(([id, t]) => !!byId[id] && t === quizDir);

  if(savedValid){
    quiz = saved.order.map(([id, type]) => makeQuizItem(byId[id], type, allWords));
    qIndex = Math.min(saved.index, quiz.length);
    correctCount = saved.correct || 0;
  } else {
    const order = shuffle(allWords);
    const types = makeTypesFor(order, quizType);
    quiz = order.map((w, i) => makeQuizItem(w, types[i], allWords));
    qIndex = 0;
    correctCount = 0;
    progressMap[currentDeck] = { order: quiz.map(q => [q.word[0], q.type]), index: 0, correct: 0 };
    saveProgress(currentDeck);
  }
  answeredCurrent = false;
}

function renderQuiz(){
  const el = document.getElementById('quiz-view');
  if(DECKS[currentDeck].words.length < 4){
    el.innerHTML = `
      <div class="card">

  if(qIndex >= quiz.length){

        <button class="btn btn-primary" id="next-btn" onclick="nextQuestion()" disabled>다음 →</button>

}

function escapeAttr(s){
  return s.replace(/&/g,'&amp;').replace(/'/g,'&#39;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

async function answer(btnEl, value){
  if(answeredCurrent) return;
  answeredCurrent = true;
  const q = quiz[qIndex];
  const isCorrect = value === q.correctVal;
  const buttons = document.querySelectorAll('#quiz-view .choice');
  buttons.forEach(b => {
    b.disabled = true;
    const raw = b.textContent;
    if(raw === q.correctVal){
      b.classList.add('correct');
    } else if(b === btnEl && !isCorrect){
      b.classList.add('wrong');
    }
  });
  document.getElementById('next-btn').disabled = false;

  if(isCorrect){
    correctCount++;
    await removeWrong(q.word[0]);
    const qIndexAtAnswer = qIndex;
    setTimeout(() => {
      if(qIndex === qIndexAtAnswer){
        nextQuestion();
      }
    }, 500);
  } else {
    await addWrong(q.word[0]);
  }
}

function nextQuestion(){
  qIndex++;

      progressMap[currentDeck] = { order: quiz.map(q => [q.word[0], q.type]), index: qIndex, correct: correctCount };
      saveProgress(currentDeck);

/* ---------------- Mixed pop-quiz (all decks combined) ---------------- */
const MIX_SIZE = 20;
let mixQuiz = [];
let mixIndex = 0;
let mixCorrect = 0;
let mixAnswered = false;

function getAllWords(){
  let combined = [];
  Object.keys(DECKS).forEach(deckId => {
    const quizType = DECKS[deckId].quizType || 'trans';
    DECKS[deckId].words.forEach(w => {
      combined.push({ id: w[0], en: w[1], kr: w[2], deckId, deckTitle: DECKS[deckId].title, quizType });
    });
  });
  return combined;
}

function buildMixQuiz(){
  const pool = getAllWords();
  if(pool.length === 0){
    mixQuiz = [];
    mixIndex = 0; mixCorrect = 0;
    return;
  }
  const count = Math.min(MIX_SIZE, pool.length);
  const picked = shuffle(pool).slice(0, count);

  mixQuiz = picked.map((w) => {
    // Pair-type decks (collocation "next word" quizzes) ask the sequence question;
    // every other deck always shows English and asks for the Korean meaning.
    const type = w.quizType === 'pair' ? 'seq' : quizDir;
    const correctVal = type === 'k2e' ? w.en : w.kr;
    // Distractors always come from the SAME deck as the question word, never mixed across decks.
    const sameDeck = pool.filter(x => x.deckId === w.deckId && x.id !== w.id);
    const distractorPool = type === 'seq'
      ? sameDeck.filter(x => x.quizType === 'pair')
      : sameDeck;
    let distractors = shuffle(distractorPool).slice(0, 3).map(x => type === 'k2e' ? x.en : x.kr);
    const options = shuffle([correctVal, ...distractors]);
    return { word: w, type, options, correctVal };
  });
  mixIndex = 0;
  mixCorrect = 0;
  mixAnswered = false;
}

function renderMixQuiz(){
  const el = document.getElementById('mix-view');
  const pool = getAllWords();
  if(pool.length === 0){
    el.innerHTML = `
      <div class="card">
        <div class="holes"><span></span><span></span><span></span></div>
        <div class="summary">
          <p>🌱</p>
          <p>단어장에 단어가 없어요.<br>단어를 먼저 추가해주세요.</p>
        </div>
      </div>`;
    return;
  }
  if(mixIndex >= mixQuiz.length){
    renderMixSummary();
    return;
  }
  const q = mixQuiz[mixIndex];
  mixAnswered = false;
  const pct = Math.round((mixIndex / mixQuiz.length) * 100);

  let optsHtml = q.options.map(opt =>
    `<button class="choice" onclick="answerMix(this, '${escapeAttr(opt)}')">${escapeHtml(opt)}</button>`
  ).join('');

  el.innerHTML = `
    <div class="card">
      <div class="holes"><span></span><span></span><span></span></div>
      <div class="progress-row">
        <span>${mixIndex + 1} / ${mixQuiz.length} 문제</span>
        <span>정답 ${mixCorrect}개</span>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      <div class="q-type ${q.type === 'k2e' ? 'rev' : ''}">${q.type === 'seq' ? '다음 단어는?' : (q.type === 'e2k' ? 'ENGLISH → 한국어' : '한국어 → ENGLISH')} · ${escapeHtml(q.word.deckTitle)}</div>
      <div class="q-word">${escapeHtml(q.type === 'k2e' ? q.word.kr : q.word.en)}</div>
      <div class="choices">${optsHtml}</div>
      <div class="foot-row">
        <button class="btn btn-ghost" onclick="buildAndRenderMix()">🔀 새 쪽지시험</button>
        <button class="btn btn-primary" id="mix-next-btn" onclick="nextMixQuestion()" disabled>다음 →</button>
      </div>
    </div>
  `;
}

async function answerMix(btnEl, value){
  if(mixAnswered) return;
  mixAnswered = true;
  const q = mixQuiz[mixIndex];
  const isCorrect = value === q.correctVal;
  const buttons = document.querySelectorAll('#mix-view .choice');
  buttons.forEach(b => {
    b.disabled = true;
    const raw = b.textContent;
    if(raw === q.correctVal){
      b.classList.add('correct');
    } else if(b === btnEl && !isCorrect){
      b.classList.add('wrong');
    }
  });
  document.getElementById('mix-next-btn').disabled = false;

  if(isCorrect){
    mixCorrect++;
    await removeWrong(q.word.id, q.word.deckId);
    const mixIndexAtAnswer = mixIndex;
    setTimeout(() => {
      if(mixIndex === mixIndexAtAnswer){

    await addWrong(q.word.id, q.word.deckId);
  }
}

function nextMixQuestion(){

function renderMixSummary(){

/* ---------------- TOEIC score log ---------------- */
const SCORE_BUCKETS = [
  [96,100,"475-495","460-495"],
  [91,95,"435-495","425-490"],
  [86,90,"405-470","400-465"],
  [81,85,"370-450","375-440"],
  [76,80,"345-420","340-415"],
  [71,75,"320-390","310-390"],
  [66,70,"290-360","285-370"],
  [61,65,"265-335","255-340"],
  [56,60,"240-310","230-310"],
  [51,55,"215-280","200-275"],
  [46,50,"190-255","170-245"],
  [41,45,"160-230","140-215"],
  [36,40,"130-205","115-180"],
  [31,35,"105-175","95-150"],
  [26,30,"85-145","75-120"],
  [21,25,"60-115","60-95"],
  [16,20,"30-90","45-75"],
  [11,15,"5-70","30-55"],
  [6,10,"5-60","10-40"],
  [1,5,"5-50","5-30"],
  [0,0,"5-35","5-15"]
];
function scaledRange(raw, part){
  if(raw === '' || raw === null || raw === undefined) return '';
  const n = Number(raw);
  if(isNaN(n)) return '';
  for(const [min, max, l, r] of SCORE_BUCKETS){
    if(n >= min && n <= max) return part === 'L' ? l : r;
  }
  return '';
}
function midpoint(rangeStr){
  if(!rangeStr) return null;
  const parts = rangeStr.split('-').map(Number);
  if(parts.length !== 2 || parts.some(isNaN)) return null;
  return (parts[0] + parts[1]) / 2;
}

const DEFAULT_SCORE_LOG = [
  { round: "실전1",  lc: 100, rd: 86,  note: "" },
  { round: "실전2",  lc: null, rd: 91, note: "" },
  { round: "실전3",  lc: null, rd: 85, note: "" },
  { round: "실전4",  lc: null, rd: 87, note: "" },
  { round: "실전5",  lc: null, rd: 90, note: "" },
  { round: "실전6",  lc: null, rd: 87, note: "" },
  { round: "실전7",  lc: null, rd: null, note: "앞에 3개 다 맞히기 !!!" },
  { round: "실전8",  lc: null, rd: 90, note: "좀 더 세부적인 부분을 정확하게 해석하는 능력이 필요할듯" },
  { round: "실전9",  lc: null, rd: null, note: "오늘 part5 고득점 보기" },
  { round: "실전10", lc: null, rd: null, note: "" }
];

let scoreLog = null;

async function loadScoreLog(){
  try{
    const res = await kv.get('toeic_score_log', false);
    scoreLog = (res && res.value) ? JSON.parse(res.value) : DEFAULT_SCORE_LOG.slice();
  }catch(e){
    scoreLog = DEFAULT_SCORE_LOG.slice();
  }
}
async function saveScoreLog(){
  try{
    await kv.set('toeic_score_log', JSON.stringify(scoreLog), false);
  }catch(e){ /* ignore */ }
}

function updateScoreField(idx, field, value){
  if(!scoreLog[idx]) return;
  if(field === 'lc' || field === 'rd'){
    scoreLog[idx][field] = value === '' ? null : Number(value);
  } else {
    scoreLog[idx][field] = value;
  }
  saveScoreLog();
  // Only re-render the affected card's computed bits, not the whole list (keeps focus while typing).
  const card = document.querySelector(`.score-card[data-idx="${idx}"]`);
  if(card){
    const entry = scoreLog[idx];
    const lcScaled = scaledRange(entry.lc, 'L');
    const rdScaled = scaledRange(entry.rd, 'R');
    const lcEl = card.querySelector('.score-lc-scaled');
    const rdEl = card.querySelector('.score-rd-scaled');
    if(lcEl) lcEl.textContent = lcScaled ? `환산 ${lcScaled}` : '';
    if(rdEl) rdEl.textContent = rdScaled ? `환산 ${rdScaled}` : '';
    const totalEl = card.querySelector('.score-total');
    if(totalEl) totalEl.textContent = totalLabel(lcScaled, rdScaled);
  }
}

function totalLabel(lcScaled, rdScaled){
  const lm = midpoint(lcScaled);
  const rm = midpoint(rdScaled);
  if(lm === null || rm === null) return '예상 총점: LC/RD 원점수를 모두 입력하면 계산돼요';
  const total = Math.round((lm + rm) / 5) * 5;
  return `예상 총점(중간값 기준) 약 ${total}점 (LC ${lcScaled} + RD ${rdScaled})`;
}

function addScoreRound(){
  const n = scoreLog.length + 1;
  scoreLog.push({ round: `실전${n}`, lc: null, rd: null, note: "" });
  saveScoreLog();
  renderScoreLog();
}
function removeScoreRound(idx){
  scoreLog.splice(idx, 1);
  saveScoreLog();
  renderScoreLog();
}

function renderScoreLog(){
  const el = document.getElementById('score-view');
  if(!scoreLog){
    el.innerHTML = '<div class="loading">불러오는 중...</div>';
    return;
  }
  let html = '<div class="score-list">';
  scoreLog.forEach((entry, idx) => {
    const lcScaled = scaledRange(entry.lc, 'L');
    const rdScaled = scaledRange(entry.rd, 'R');
    html += `
      <div class="score-card" data-idx="${idx}">
        <div class="score-card-head">
          <input class="score-round-name" value="${escapeAttr(entry.round)}" onchange="updateScoreField(${idx}, 'round', this.value)">
          <button class="score-del" onclick="removeScoreRound(${idx})">삭제</button>
        </div>
        <div class="score-grid">
          <div class="score-field">
            <label>LC 원점수 (0-100)</label>
            <input type="number" min="0" max="100" value="${entry.lc ?? ''}" onchange="updateScoreField(${idx}, 'lc', this.value)">
            <div class="score-scaled score-lc-scaled">${lcScaled ? '환산 ' + lcScaled : ''}</div>
          </div>
          <div class="score-field">
            <label>RD 원점수 (0-100)</label>
            <input type="number" min="0" max="100" value="${entry.rd ?? ''}" onchange="updateScoreField(${idx}, 'rd', this.value)">
            <div class="score-scaled score-rd-scaled">${rdScaled ? '환산 ' + rdScaled : ''}</div>
          </div>
        </div>
        <div class="score-total">${totalLabel(lcScaled, rdScaled)}</div>
        <textarea class="score-note" placeholder="메모 (예: 헷갈렸던 파트, 다음에 신경 쓸 점)" onchange="updateScoreField(${idx}, 'note', this.value)">${escapeHtml(entry.note || '')}</textarea>
      </div>`;
  });
  html += '</div><button class="score-add-btn" onclick="addScoreRound()">+ 새 회차 추가</button>';
  el.innerHTML = html;
}

async function init(){
  document.getElementById('quiz-view').innerHTML = '<div class="loading">단어장을 불러오는 중...</div>';
  rebuildIndex();
  try{ const r = await kv.get('quiz_dir'); if(r && (r.value === 'e2k' || r.value === 'k2e')) quizDir = r.value; }catch(e){}
  renderDir();
  await loadWrongIds();
  await loadProgress();
  await loadScoreLog();
  renderDeckRow();
  renderBadge();
  buildAndRender();
}
init();
